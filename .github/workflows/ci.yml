name: CI

# Typecheck + unit tests on every PR and push to main. The extension test
# suite simulates the platform storage quirks (Safari UTF-16 accounting,
# brim double-count wedge, context kills) that field debugging surfaced —
# see extension-chrome/test/.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm -r --if-present test
      - run: pnpm build
