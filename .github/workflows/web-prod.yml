name: Deploy web → production (webtm.io)

# Every push to main that touches the web app auto-builds and ships to webtm.io.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "shared/**"
      - "pnpm-lock.yaml"
  workflow_dispatch: {}

concurrency:
  group: web-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wtm/web build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: deploy
